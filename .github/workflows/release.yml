name: Release

# Publishes a GitHub release (and its tag) whenever the version in
# package.json changes on main and no release exists for it yet.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "$version already released"
          else
            gh release create "$version" --target "$GITHUB_SHA" --generate-notes --title "$version"
          fi
